<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任务看板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">▦</span>任务看板</div>
    <div class="stats">
      <span class="chip">分块 <b id="stat-boards">0</b></span>
      <span class="chip">任务 <b id="stat-tasks">0</b></span>
      <span class="chip">子任务 <b id="stat-subs">0</b></span>
      <span class="chip">已完成 <b id="stat-done">0</b></span>
      <span class="chip">总进度 <b id="stat-progress">0%</b></span>
    </div>
    <div class="actions">
      <button id="btn-add-board" class="btn primary">＋ 分块</button>
      <button id="btn-import" class="btn">导入</button>
      <button id="btn-export" class="btn">导出</button>
      <button id="btn-theme" class="btn" title="切换深色/浅色主题">🌓</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </header>

  <main id="boards" class="boards"></main>

  <script src="app.js"></script>
</body>
</html>
